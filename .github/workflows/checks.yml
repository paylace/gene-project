name: 코드와 연구 문서 검사
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -B -X utf8 tools/check_research_layout.py --tests
      - run: python -B -X utf8 -m unittest discover -s tools/tests -v
      - run: python -B -X utf8 tools/q1_plan.py > q1_004_plan_preview.json
